<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8"></meta>
		<link rel="stylesheet" href="./main.css"></link>
		<script src="./main.js" defer></script>
	</head>
	<body>
		<sp-theme scale="medium">
			<div id="head-group">
				<sp-body id="title" size="L">Arena Link</sp-body>
				<sp-body id="status" size="S">Not connected</sp-body>
			</div>

			<div id="url-group">
				<sp-textfield id="url-field" placeholder="https://bridge-host"></sp-textfield>
				<sp-button id="connect-button">Connect</sp-button>
			</div>

			<div id="agent-group">
				<sp-checkbox id="agent-switch" checked>Let the agent drive InDesign</sp-checkbox>
				<sp-body id="link-status" size="S">Link off</sp-body>
			</div>

			<div id="ask-group">
				<sp-textarea id="ask-textarea" placeholder="Ask the agent …"></sp-textarea>
				<div id="ask-button-group">
					<sp-action-button id="import-button" quiet title="Import the selected text">
						<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16"><defs><style>.fill{fill:currentcolor;}</style></defs><rect fill="#ff13dc" width="16" height="16" opacity="0"/><path class="fill" d="M0.7,7.6C0.6,8,0.7,8.4,1,8.7l4.9,4.9c0.4,0.4,1.1,0.4,1.5,0c0.4-0.4,0.4-1.1,0-1.5L4.3,9h10.3c0.6,0,1.1-0.5,1.1-1.1c0-0.6-0.5-1.1-1.1-1.1H4.3l3.1-3.1c0.4-0.4,0.4-1.1,0-1.5C7,1.9,6.3,1.9,5.9,2.3L1,7.2C0.9,7.3,0.8,7.4,0.7,7.6z"/></svg>
					</sp-action-button>
					<sp-action-button id="clipboard-button" quiet title="Copy the result">
						<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18" width="16" height="16"><defs><style>.fill{fill:currentcolor;}</style></defs><rect fill="#ff13dc" opacity="0" width="18" height="18"/><path class="fill" d="M11,3V2A2,2,0,0,0,7,2V3H5V5h8V3ZM10,3H8V2a1,1,0,0,1,2,0Z"/><path class="fill" d="M15.5,3H14V5.5a.5.5,0,0,1-.5.5h-9A.5.5,0,0,1,4,5.5V3H2.5a.5.5,0,0,0-.5.5v13a.5.5,0,0,0,.5.5h13a.5.5,0,0,0,.5-.5V3.5A.5.5,0,0,0,15.5,3Z"/></svg>
					</sp-action-button>
					<sp-button id="send-button">Send</sp-button>
				</div>
			</div>

			<div id="result-group">
				<textarea id="context-textarea" placeholder="Selected text / extra context (optional)"></textarea>
				<textarea id="result-textarea" placeholder="Answer"></textarea>
				<div id="result-button-group">
					<sp-button id="insert-button">Insert</sp-button>
				</div>
			</div>

			<div id="footer-group">
				<sp-body id="error-message" size="S">&nbsp;</sp-body>
			</div>
		</sp-theme>
	</body>
</html>
